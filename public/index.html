<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 1.21.11 Client UI</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        .panel { background: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; }
        input, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #444; background: #3c3c3c; color: #fff; }
        button { background: #4CAF50; cursor: pointer; border: none; font-weight: bold; }
        button.disconnect { background: #f44336; }
        
        .main-content { display: flex; gap: 15px; flex: 1; min-height: 0; position: relative; }
        
        /* 3D Render Viewport Frame */
        #viewer-frame { flex: 2; background: #000; border: none; border-radius: 8px; width: 100%; height: 100%; }

        /* Container / Chest Menu Overlay */
        #container-menu {
            position: absolute; top: 50%; left: 35%; transform: translate(-50%, -50%);
            background: #c6c6c6; border: 4px solid #373737; padding: 10px; border-radius: 6px;
            color: #000; display: none; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .slot-grid { display: grid; grid-template-columns: repeat(9, 36px); gap: 3px; background: #8b8b8b; padding: 4px; border: 2px solid #373737; }
        .menu-slot { width: 36px; height: 36px; background: #8b8b8b; border: 2px solid #373737; border-top-color: #fff; border-left-color: #fff; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; }

        #chat-hud { position: absolute; bottom: 15px; left: 15px; width: 350px; height: 100px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; z-index: 50; }
        .chat-line { background: rgba(0,0,0,0.4); padding: 3px 6px; font-size: 12px; border-radius: 2px; }
    </style>
</head>
<body>

    <h2>Minecraft 1.21.11 Connected Client</h2>
    
    <div class="panel">
        <label>Username:</label>
        <input type="text" id="username" value="SteveBot">
        <label>Server IP:</label>
        <input type="text" id="host" placeholder="play.example.com">
        <label>Port:</label>
        <input type="number" id="port" value="25565" style="width: 80px;">
        <button id="connect-btn" onclick="toggleConnection()">Connect</button>
    </div>

    <div class="main-content">
        <!-- Embedded Prismarine 3D World Viewer Canvas -->
        <iframe id="viewer-frame" src="about:blank"></iframe>

        <!-- Dynamic Container / Chest UI Menu -->
        <div id="container-menu">
            <h4 id="menu-title" style="margin: 0 0 8px 0; color: #373737;">Container</h4>
            <div class="slot-grid" id="menu-slots"></div>
            <button onclick="closeMenu()" style="margin-top: 8px; width: 100%; background: #a00;">Close</button>
        </div>

        <div id="chat-hud"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatHud = document.getElementById('chat-hud');
        let messageHistory = [];

        socket.on('status', (state) => {
            const btn = document.getElementById('connect-btn');
            btn.textContent = state.connected ? 'Disconnect' : 'Connect';
            btn.className = state.connected ? 'disconnect' : '';
            if (state.connected) {
                // Point iframe viewer to backend viewer port when connected
                setTimeout(() => {
                    document.getElementById('viewer-frame').src = `http://${window.location.hostname}:3007`;
                }, 1000);
            } else {
                document.getElementById('viewer-frame').src = 'about:blank';
            }
        });

        socket.on('chat-message', (data) => {
            messageHistory.push(data);
            if (messageHistory.length > 5) messageHistory.shift();
            chatHud.innerHTML = messageHistory.map(m => `<div class="chat-line"><b>[${m.sender}]</b> ${m.message}</div>`).join('');
        });

        // Triggered when server opens a chest or inventory menu
        socket.on('inventory-opened', (data) => {
            document.getElementById('menu-title').textContent = data.title || 'Container Menu';
            const grid = document.getElementById('menu-slots');
            grid.innerHTML = '';
            data.items.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'menu-slot';
                slot.textContent = item ? item.name.substring(0, 4) : '';
                slot.title = item ? `${item.name} (${item.count})` : '';
                grid.appendChild(slot);
            });
            document.getElementById('container-menu').style.display = 'block';
        });

        function closeMenu() {
            document.getElementById('container-menu').style.display = 'none';
        }

        function toggleConnection() {
            const connected = document.getElementById('connect-btn').classList.contains('disconnect');
            if (!connected) {
                socket.emit('connect-server', {
                    username: document.getElementById('username').value.trim(),
                    host: document.getElementById('host').value.trim(),
                    port: document.getElementById('port').value.trim()
                });
            } else {
                socket.emit('disconnect-server');
            }
        }
    </script>
</body>
</html>
